<!DOCTYPE html>
<html>

<head>

    <title>Payment - FarmConnect AI</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            margin:0;
        }

        .header{
            background:#1565c0;
            color:white;
            padding:20px;
            text-align:center;
        }

        .container{
            width:90%;
            max-width:500px;
            margin:auto;
            margin-top:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:15px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }

        button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:15px;
        }

        button:disabled{
            opacity:0.6;
            cursor:not-allowed;
        }

        .cod{
            background:#2e7d32;
            color:white;
        }

        .razor{
            background:#1976d2;
            color:white;
        }

        .order-info{
            background:#e3f2fd;
            padding:12px;
            border-radius:5px;
            margin-bottom:15px;
        }

        .loading{
            display:none;
            text-align:center;
            margin-top:15px;
            color:#1565c0;
        }

        .error{
            color:#d32f2f;
            text-align:center;
            display:none;
            margin-top:15px;
        }

    </style>

</head>


<body>

<div class="header">
    💳 Choose Payment Method
</div>


<div class="container">

    <div class="card">

        <div class="order-info">

            <p>
                <strong>Order ID:</strong>
                <span id="orderIdText">Loading...</span>
            </p>

            <p>
                <strong>Amount:</strong>
                ₹<span id="amountText">0</span>
            </p>

        </div>


        <h3>Choose Payment Method</h3>

        <p>Select a payment method below.</p>


        <!-- RAZORPAY -->

        <button
            id="razorpayButton"
            class="razor"
            onclick="payRazorpay()"
        >
            💳 Pay Online - Card / UPI / Net Banking
        </button>


        <!-- COD -->

        <button
            id="codButton"
            class="cod"
            onclick="payCOD()"
        >
            🚚 Cash on Delivery
        </button>


        <div
            class="loading"
            id="loading"
        >
            Processing payment...
        </div>


        <div
            class="error"
            id="errorMessage"
        >
        </div>

    </div>

</div>


<script>

/* =====================================================
   GET ORDER ID
===================================================== */

const params = new URLSearchParams(
    window.location.search
);

const orderId = params.get("order_id");

const orderIdText =
    document.getElementById("orderIdText");

const amountText =
    document.getElementById("amountText");

const loading =
    document.getElementById("loading");

const errorMessage =
    document.getElementById("errorMessage");

const razorpayButton =
    document.getElementById("razorpayButton");

const codButton =
    document.getElementById("codButton");


/* =====================================================
   CHECK ORDER ID
===================================================== */

if(!orderId){

    orderIdText.innerText = "Missing";

    showError(
        "Order ID is missing. Please place the order again."
    );

    razorpayButton.disabled = true;
    codButton.disabled = true;

}
else{

    orderIdText.innerText = orderId;

    loadOrder();

}


/* =====================================================
   LOAD ORDER DETAILS
===================================================== */

async function loadOrder(){

    try{

        const response = await fetch(
            "/order-details/" + encodeURIComponent(orderId)
        );

        const data = await response.json();


        if(!response.ok || !data.success){

            showError(
                data.message ||
                "Unable to load order details."
            );

            razorpayButton.disabled = true;
            codButton.disabled = true;

            return;
        }


        amountText.innerText =
            Number(data.total_price).toFixed(2);


    }
    catch(error){

        console.error(error);

        showError(
            "Unable to connect to the server."
        );

        razorpayButton.disabled = true;
        codButton.disabled = true;

    }

}


/* =====================================================
   RAZORPAY PAYMENT
===================================================== */

async function payRazorpay(){

    if(!orderId){

        alert("Order ID is missing.");

        return;
    }


    setLoading(true);


    try{

        /* ---------------------------------------------
           CREATE RAZORPAY ORDER
        --------------------------------------------- */

        const response = await fetch(
            "/create-razorpay-order",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    order_id:orderId
                })
            }
        );


        const data = await response.json();


        if(!response.ok || !data.success){

            alert(
                data.message ||
                "Unable to create payment."
            );

            setLoading(false);

            return;
        }


        /* ---------------------------------------------
           RAZORPAY CHECKOUT OPTIONS
        --------------------------------------------- */

        const options = {

            key:data.key_id,

            amount:data.amount,

            currency:data.currency || "INR",

            name:"FarmConnect AI",

            description:
                "Payment for FarmConnect AI Order",

            order_id:data.razorpay_order_id,


            /* -----------------------------------------
               PAYMENT SUCCESS
            ----------------------------------------- */

            handler:async function(paymentResponse){

                try{

                    setLoading(true);


                    const verifyResponse =
                        await fetch(
                            "/verify-payment",
                            {
                                method:"POST",

                                headers:{
                                    "Content-Type":
                                        "application/json"
                                },

                                body:JSON.stringify({

                                    order_id:orderId,

                                    razorpay_order_id:
                                        paymentResponse
                                        .razorpay_order_id,

                                    razorpay_payment_id:
                                        paymentResponse
                                        .razorpay_payment_id,

                                    razorpay_signature:
                                        paymentResponse
                                        .razorpay_signature

                                })
                            }
                        );


                    const result =
                        await verifyResponse.json();


                    if(
                        verifyResponse.ok &&
                        result.success
                    ){

                        window.location.href =
                            "/order_success?order_id=" +
                            encodeURIComponent(orderId);

                    }
                    else{

                        alert(
                            result.message ||
                            "Payment verification failed."
                        );

                    }

                }
                catch(error){

                    console.error(error);

                    alert(
                        "Payment verification failed. Please contact support if money was deducted."
                    );

                }
                finally{

                    setLoading(false);

                }

            },


            /* -----------------------------------------
               PREFILL CUSTOMER INFORMATION
            ----------------------------------------- */

            prefill:{
                name:"",
                contact:"",
                email:""
            },


            theme:{
                color:"#1565c0"
            },


            /* -----------------------------------------
               PAYMENT WINDOW CLOSED
            ----------------------------------------- */

            modal:{

                ondismiss:function(){

                    setLoading(false);

                }

            }

        };


        /* ---------------------------------------------
           OPEN RAZORPAY
        --------------------------------------------- */

        const razorpay =
            new Razorpay(options);


        razorpay.on(
            "payment.failed",
            function(response){

                console.error(
                    "Payment failed:",
                    response.error
                );

                alert(
                    response.error.description ||
                    "Payment failed. Please try again."
                );

                setLoading(false);

            }
        );


        razorpay.open();

    }
    catch(error){

        console.error(error);

        alert(
            "Unable to start payment. Please try again."
        );

        setLoading(false);

    }

}


/* =====================================================
   CASH ON DELIVERY
===================================================== */

async function payCOD(){

    if(!orderId){

        alert("Order ID is missing.");

        return;
    }


    const confirmed = confirm(
        "Do you want to place this order with Cash on Delivery?"
    );


    if(!confirmed){

        return;
    }


    setLoading(true);


    try{

        const response = await fetch(
            "/payment/cod",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    order_id:orderId
                })
            }
        );


        const data =
            await response.json();


        if(response.ok && data.success){

            window.location.href =
                "/order_success?order_id=" +
                encodeURIComponent(orderId);

            return;

        }


        alert(
            data.message ||
            "Unable to place COD order."
        );

    }
    catch(error){

        console.error(error);

        alert(
            "Something went wrong. Please try again."
        );

    }
    finally{

        setLoading(false);

    }

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(isLoading){

    loading.style.display =
        isLoading ? "block" : "none";

    razorpayButton.disabled =
        isLoading;

    codButton.disabled =
        isLoading;

}


/* =====================================================
   ERROR MESSAGE
===================================================== */

function showError(message){

    errorMessage.innerText =
        message;

    errorMessage.style.display =
        "block";

}

</script>

</body>

</html>
