<!DOCTYPE html>
<html>
<head>

<title>Farmer Forgot Password</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
width:350px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#2e7d32;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#2e7d32;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}

p{
text-align:center;
margin-top:15px;
}

a{
color:#2e7d32;
text-decoration:none;
}

a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="box">

<h2>🔑 Farmer Forgot Password</h2>

<p>
Enter your registered email address.
</p>

<input
type="email"
id="email"
placeholder="Email"
required>

<button onclick="forgotPassword()">
Reset Password
</button>

<p>
<a href="/farmer-login.html">
Back to Login
</a>
</p>

</div>

<script>

function forgotPassword(){

const email =
document.getElementById("email").value.trim();

if(!email){

alert("Please enter your email address.");
return;

}

fetch("/farmer-forgot-password",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email
})

})

.then(res => res.json())

.then(data => {

if(!data.success){

alert(data.message);
return;

}

if(data.reset_token){

window.location.href =
"/reset-password.html?type=farmer&token="
+ encodeURIComponent(data.reset_token);

}else{

alert(data.message);

}

})

.catch(error => {

console.error(error);

alert("Something went wrong. Please try again.");

});

}

</script>

</body>
</html>
