<!DOCTYPE html>
<html>
<head>

<title>Customer Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
width:350px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#1565c0;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#1565c0;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

p{
text-align:center;
margin-top:15px;
}

a{
color:#1565c0;
text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h2>🛒 Customer Login</h2>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button onclick="login()">
Login
</button>

<p>
New Customer?
<a href="/customerRegister">
Register
</a>
</p>

</div>

<script>

function login(){

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

if(!email || !password){

alert("Please enter email and password.");
return;

}

fetch("/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email,
password:password

})

})

.then(res => {

if(!res.ok){
throw new Error("Login request failed");
}

return res.json();

})

.then(data => {

alert(data.message);

if(data.success){

window.location.href = "/products";

}

})

.catch(error => {

console.error(error);

alert("Something went wrong during login. Please try again.");

});

}

</script>

</body>
</html>
