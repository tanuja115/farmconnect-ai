<!DOCTYPE html>
<html>

<head>

<title>Place Order - FarmConnect AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

.header{
background:#1565c0;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:500px;
margin:30px auto;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

input,
textarea{
width:100%;
padding:12px;
margin:8px 0 15px;
box-sizing:border-box;
border:1px solid #ccc;
border-radius:8px;
}

textarea{
height:100px;
resize:none;
}

button{
width:100%;
padding:13px;
border:none;
background:#2e7d32;
color:white;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1b5e20;
}

.product-info{
background:#f5f5f5;
padding:15px;
border-radius:8px;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="header">
<h1>🛒 Place Order</h1>
</div>

<div class="container">

<div class="card">

<div class="product-info">

<h2 id="productName">Product</h2>

<p>
Price: ₹<span id="productPrice">0</span>
</p>

</div>

<form id="orderForm">

<label>Full Name</label>

<input
type="text"
id="customerName"
placeholder="Enter your full name"
required
>

<label>Mobile Number</label>

<input
type="tel"
id="mobile"
placeholder="Enter mobile number"
pattern="[0-9]{10}"
required
>

<label>Delivery Address</label>

<textarea
id="address"
placeholder="Enter complete delivery address"
required
></textarea>

<label>Quantity (kg)</label>

<input
type="number"
id="quantity"
min="1"
value="1"
required
>

<button type="submit">
Place Order
</button>

</form>

</div>

</div>


<script>

const params = new URLSearchParams(window.location.search);

const product = params.get("product");
const price = params.get("price");
const quantityFromURL = params.get("quantity");


document.getElementById("productName").textContent =
    product || "Product";

document.getElementById("productPrice").textContent =
    price || "0";

if(quantityFromURL){

    document.getElementById("quantity").value =
        quantityFromURL;

}


document.getElementById("orderForm").addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const customerName =
            document.getElementById("customerName").value.trim();

        const mobile =
            document.getElementById("mobile").value.trim();

        const address =
            document.getElementById("address").value.trim();

        const quantity =
            parseFloat(document.getElementById("quantity").value);


        if(!customerName || !mobile || !address || quantity <= 0){

            alert("Please fill all details correctly.");

            return;
        }


        try{

            const response = await fetch("/order",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    product:product,

                    price:parseFloat(price),

                    quantity:quantity,

                    customer_name:customerName,

                    mobile:mobile,

                    address:address

                })

            });


            const data = await response.json();


            if(data.success){

                window.location.href =
                    "/payment.html?order_id=" +
                    encodeURIComponent(data.order_id);

            }
            else{

                alert(data.message || "Failed to place order.");

            }

        }
        catch(error){

            console.error(error);

            alert("Something went wrong. Please try again.");

        }

    }

);

</script>

</body>

</html>
