<!DOCTYPE html>
<html>
<head>

<title>Reset Password</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:350px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#2e7d32;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.message{
    text-align:center;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="box">

    <h2>🔐 Reset Password</h2>

    <input
        type="password"
        id="password"
        placeholder="New Password"
    >

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
    >

    <button onclick="resetPassword()">
        Reset Password
    </button>

    <div
        id="message"
        class="message"
    ></div>

</div>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const type =
    params.get("type");

const token =
    params.get("token");


async function resetPassword(){

    const password =
        document.getElementById(
            "password"
        ).value;

    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;

    const message =
        document.getElementById(
            "message"
        );

    if(!token){

        message.innerText =
            "Invalid or missing reset token.";

        return;
    }

    if(!password || !confirmPassword){

        message.innerText =
            "Please fill both fields.";

        return;
    }

    if(password.length < 6){

        message.innerText =
            "Password must contain at least 6 characters.";

        return;
    }

    if(password !== confirmPassword){

        message.innerText =
            "Passwords do not match.";

        return;
    }

    let endpoint;

    if(type === "farmer"){

        endpoint =
            "/farmer-reset-password";

    }else{

        endpoint =
            "/reset-password";
    }

    try{

        const response =
            await fetch(
                endpoint,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        token:token,
                        password:password
                    })
                }
            );

        const data =
            await response.json();

        message.innerText =
            data.message;

        if(data.success){

            setTimeout(
                function(){

                    if(type === "farmer"){

                        window.location.href =
                            "farmer-login.html";

                    }else{

                        window.location.href =
                            "customer-login.html";
                    }

                },
                1500
            );
        }

    }catch(error){

        console.error(error);

        message.innerText =
            "Unable to connect to server.";
    }

}

</script>

</body>
</html>
