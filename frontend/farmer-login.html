<!DOCTYPE html>
<html>
<head>
<title>Farmer Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family:Arial;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:350px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#2e7d32;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

p{
    text-align:center;
    margin-top:15px;
}

a{
    color:#2e7d32;
    text-decoration:none;
}

.forgot{
    display:block;
    text-align:right;
    margin-top:5px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="box">

    <h2>👨‍🌾 Farmer Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <a
        href="farmer-forgot-password.html"
        class="forgot"
    >
        Forgot Password?
    </a>

    <br>

    <button onclick="login()">
        Login
    </button>

    <p>
        New Farmer?
        <a href="farmer-register.html">
            Register
        </a>
    </p>

</div>

<script>

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if(!email || !password){

        alert("Please enter email and password.");
        return;
    }

    try{

        const response = await fetch(
            "/farmer-login",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    email:email,
                    password:password
                })
            }
        );

        const data = await response.json();

        alert(data.message);

        if(data.success){

            window.location.href =
                "farmerDashboard.html";
        }

    }catch(error){

        console.error(error);

        alert(
            "Unable to connect to server."
        );
    }
}

</script>

</body>
</html>
