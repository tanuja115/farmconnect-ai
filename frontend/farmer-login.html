<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Farmer Login | FarmConnect AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(27, 94, 32, 0.75),
                    rgba(46, 125, 50, 0.75)
                ),
                url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 400px;

            background: rgba(255, 255, 255, 0.97);

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ccc;
            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2e7d32;

            box-shadow:
                0 0 0 3px rgba(46, 125, 50, 0.12);
        }

        .forgot {
            display: block;

            text-align: right;

            margin-top: -5px;
            margin-bottom: 20px;

            color: #2e7d32;

            text-decoration: none;

            font-size: 14px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;

            padding: 14px;

            background: #2e7d32;
            color: white;

            border: none;
            border-radius: 9px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #1b5e20;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;

            margin-top: 15px;
            padding: 10px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;
        }

        .message.error {
            display: block;

            background: #ffebee;
            color: #c62828;
        }

        .message.success {
            display: block;

            background: #e8f5e9;
            color: #2e7d32;
        }

        .register {
            text-align: center;

            margin-top: 22px;

            color: #555;

            font-size: 14px;
        }

        .register a {
            color: #2e7d32;

            font-weight: bold;

            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #777;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #2e7d32;
        }

        @media (max-width: 480px) {

            .box {
                padding: 28px 22px;
            }

            .logo {
                font-size: 40px;
            }

            h2 {
                font-size: 23px;
            }
        }

    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        👨‍🌾
    </div>

    <h2>Farmer Login</h2>

    <p class="subtitle">
        Login to manage your FarmConnect products
    </p>


    <!-- EMAIL -->

    <div class="form-group">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
        >

    </div>


    <!-- PASSWORD -->

    <div class="form-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >

    </div>


    <!-- FORGOT PASSWORD -->

    <a
        href="/farmer-forgot-password.html"
        class="forgot"
    >
        Forgot Password?
    </a>


    <!-- LOGIN BUTTON -->

    <button
        id="loginButton"
        onclick="login()"
    >
        Login
    </button>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- REGISTER -->

    <p class="register">

        New Farmer?

        <a href="/farmer-register.html">
            Create an Account
        </a>

    </p>


    <!-- BACK -->

    <a
        href="/"
        class="back"
    >
        ← Back to FarmConnect AI
    </a>

</div>


<script>

async function login() {

    const email =
        document.getElementById("email")
            .value
            .trim()
            .toLowerCase();

    const password =
        document.getElementById("password")
            .value;

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    // Clear previous message

    message.className = "message";
    message.textContent = "";


    // Validate fields

    if (!email || !password) {

        showMessage(
            "Please enter email and password.",
            "error"
        );

        return;
    }


    // Basic email validation

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {

        showMessage(
            "Please enter a valid email address.",
            "error"
        );

        return;
    }


    try {

        // Disable button

        button.disabled = true;

        button.textContent = "Logging in...";


        // Send request to Flask

        const response = await fetch(
            "/farmer-login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                credentials: "include",

                body: JSON.stringify({

                    email: email,

                    password: password

                })
            }
        );


        // Convert response to JSON

        const data =
            await response.json();


        // Login successful

        if (data.success) {

            showMessage(
                data.message ||
                "Farmer Login Successful",
                "success"
            );


            /*
             IMPORTANT:

             Do NOT directly open
             farmerDashboard.html.

             Flask has a protected route:

             /farmer-dashboard

             Flask checks:

             session["farmer_id"]

             before allowing dashboard access.
            */

            setTimeout(() => {

                window.location.href =
                    "/farmer-dashboard";

            }, 700);

        }

        // Login failed

        else {

            showMessage(
                data.message ||
                "Invalid Email or Password",
                "error"
            );

            button.disabled = false;

            button.textContent = "Login";
        }

    }

    catch (error) {

        console.error(
            "Farmer login error:",
            error
        );

        showMessage(
            "Unable to connect to server. Please try again.",
            "error"
        );

        button.disabled = false;

        button.textContent = "Login";
    }
}


/*
Show message
*/

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;
}


/*
Allow Enter key to login
*/

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );

</script>

</body>
</html>
